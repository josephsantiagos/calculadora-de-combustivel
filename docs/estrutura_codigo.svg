<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Estrutura do codigo do app calculadora de combustivel">
  <defs>
    <style>
      .title { font: 800 44px Verdana, sans-serif; fill: #0f172a; }
      .sub { font: 500 21px Verdana, sans-serif; fill: #334155; }
      .h { font: 700 26px Verdana, sans-serif; fill: #111827; }
      .b { font: 700 20px Verdana, sans-serif; fill: #111827; }
      .t { font: 500 17px Verdana, sans-serif; fill: #1f2937; }
      .mono { font: 700 16px 'Courier New', monospace; fill: #0f172a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#64748b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="#f8fafc"/>

  <text x="60" y="70" class="title">Estrutura do codigo - main.dart</text>
  <text x="60" y="104" class="sub">Mapa visual das classes, widgets e funcoes do app</text>

  <rect x="60" y="130" width="1480" height="90" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="90" y="185" class="h">Arquivo: lib/main.dart</text>

  <rect x="90" y="270" width="450" height="160" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
  <text x="120" y="315" class="b">1) main()</text>
  <text x="120" y="345" class="t">Chama runApp com o widget raiz.</text>
  <text x="120" y="380" class="mono">runApp(const CalculadoraCombustivelApp())</text>

  <rect x="590" y="270" width="450" height="220" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <text x="620" y="315" class="b">2) CalculadoraCombustivelApp (StatelessWidget)</text>
  <text x="620" y="345" class="t">Responsavel por configuracao global.</text>
  <text x="620" y="375" class="t">- MaterialApp</text>
  <text x="620" y="402" class="t">- ThemeData e ColorScheme</text>
  <text x="620" y="429" class="t">- home: CalculadoraPage</text>

  <rect x="1090" y="270" width="450" height="220" rx="16" fill="#fae8ff" stroke="#a855f7" stroke-width="3" filter="url(#shadow)"/>
  <text x="1120" y="315" class="b">3) CalculadoraPage (StatefulWidget)</text>
  <text x="1120" y="345" class="t">Representa a tela principal do app.</text>
  <text x="1120" y="375" class="t">Cria o estado:</text>
  <text x="1120" y="405" class="mono">_CalculadoraPageState</text>

  <line x1="540" y1="350" x2="590" y2="350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1040" y1="380" x2="1090" y2="380" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="90" y="540" width="700" height="300" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <text x="120" y="585" class="b">4) _CalculadoraPageState (estado e interface)</text>
  <text x="120" y="615" class="t">Estado guardado:</text>
  <text x="120" y="645" class="t">- _formKey</text>
  <text x="120" y="672" class="t">- 3 controllers: distancia, litros, preco</text>
  <text x="120" y="699" class="t">- resultados: consumoKmL, consumoL100Km, custoPorKm, custoTotal</text>
  <text x="120" y="736" class="t">dispose() libera os controllers para evitar vazamento de memoria.</text>
  <text x="120" y="773" class="t">build() monta: Scaffold -> AppBar -> Form -> campos -> botoes -> Card de resultado.</text>

  <rect x="840" y="540" width="700" height="300" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="870" y="585" class="b">5) Funcoes de negocio</text>
  <text x="870" y="620" class="t">_validarNumeroPositivo(value, campo): valida vazio e valor maior que zero.</text>
  <text x="870" y="655" class="t">_parseNumero(value): converte texto para double, aceitando virgula/ponto.</text>
  <text x="870" y="690" class="t">_calcular(): valida formulario, calcula consumo e custos, atualiza com setState.</text>
  <text x="870" y="725" class="t">_limpar(): reseta formulario, limpa campos e remove resultados com setState.</text>

  <line x1="440" y1="430" x2="440" y2="540" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1315" y1="490" x2="1315" y2="540" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="90" y="900" width="1450" height="220" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
  <text x="120" y="945" class="b">Arvore simplificada de widgets</text>
  <text x="120" y="980" class="mono">main -> CalculadoraCombustivelApp -> MaterialApp -> CalculadoraPage</text>
  <text x="120" y="1010" class="mono">-> Scaffold -> SafeArea -> SingleChildScrollView -> Form -> Column</text>
  <text x="120" y="1040" class="mono">-> TextFormField (distancia, litros, preco) + botoes (Calcular, Limpar)</text>
  <text x="120" y="1070" class="mono">-> Card (resultado aparece so quando os valores foram calculados)</text>
</svg>
